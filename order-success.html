<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pharmora | Order Successful</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root { --teal:#0d9488; --teal-light:#14b8a6; --navy:#0f172a; --muted:#64748b; }
    body {
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a 0%,#134e4a 60%,#0f172a 100%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:24px; position:relative; overflow:hidden;
    }
    .bg-orb { position:fixed; border-radius:50%; filter:blur(90px); pointer-events:none; }
    .bg-orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(13,148,136,0.25),transparent); top:-150px; right:-150px; }
    .bg-orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(6,182,212,0.15),transparent); bottom:-100px; left:-100px; }

    /* Confetti dots */
    .confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
    .c-dot { position:absolute; border-radius:50%; animation:fall linear infinite; }
    @keyframes fall {
      0%   { transform:translateY(-20px) rotate(0deg); opacity:1; }
      100% { transform:translateY(110vh)  rotate(720deg); opacity:0; }
    }

    .success-card {
      background:white; border-radius:28px; padding:56px 48px;
      max-width:520px; width:100%; text-align:center;
      box-shadow:0 32px 80px rgba(0,0,0,0.4);
      animation:popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
      position:relative; z-index:10;
    }
    @keyframes popIn { from{opacity:0;transform:scale(0.7)} to{opacity:1;transform:scale(1)} }

    .check-circle {
      width:96px; height:96px; border-radius:50%;
      background:linear-gradient(135deg,var(--teal),var(--teal-light));
      display:flex; align-items:center; justify-content:center;
      margin:0 auto 28px;
      box-shadow:0 12px 40px rgba(13,148,136,0.45);
      animation:checkPop 0.8s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes checkPop { from{transform:scale(0) rotate(-30deg)} to{transform:scale(1) rotate(0)} }
    .check-icon { font-size:44px; line-height:1; }

    .success-title {
      font-family:'Syne',sans-serif; font-size:30px; font-weight:800;
      color:var(--navy); margin-bottom:10px;
    }
    .success-sub { font-size:15px; color:var(--muted); line-height:1.6; margin-bottom:32px; }

    .order-box {
      background:#f0fdfa; border:1.5px solid #99f6e4; border-radius:16px;
      padding:20px 24px; margin-bottom:32px; text-align:left;
    }
    .order-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:14px; }
    .order-row:not(:last-child) { border-bottom:1px solid #ccfbf1; }
    .order-label { color:var(--muted); }
    .order-val   { font-weight:700; color:var(--navy); }
    .status-pill {
      background:#dcfce7; color:#16a34a; border-radius:20px;
      padding:3px 12px; font-size:12px; font-weight:700;
    }

    .items-preview { margin-bottom:28px; text-align:left; }
    .items-preview h4 { font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:12px; }
    .item-chip {
      display:inline-flex; align-items:center; gap:8px;
      background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px;
      padding:6px 12px; margin:4px; font-size:13px; color:var(--navy);
    }

    .delivery-info {
      background:linear-gradient(135deg,#0d9488,#0f766e); color:white;
      border-radius:16px; padding:16px 20px; margin-bottom:32px;
      display:flex; align-items:center; gap:14px; text-align:left;
    }
    .delivery-icon { font-size:30px; flex-shrink:0; }
    .delivery-text strong { display:block; font-size:15px; margin-bottom:2px; }
    .delivery-text small { font-size:13px; opacity:0.85; }

    .btn-group { display:flex; gap:12px; flex-wrap:wrap; }
    .btn-primary {
      flex:1; min-width:140px; padding:14px 20px;
      background:linear-gradient(135deg,var(--teal),var(--teal-light));
      color:white; border:none; border-radius:14px;
      font-family:'Syne',sans-serif; font-size:15px; font-weight:700;
      cursor:pointer; transition:all 0.3s; text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(13,148,136,0.45); }
    .btn-outline {
      flex:1; min-width:140px; padding:14px 20px;
      background:white; border:1.5px solid #e2e8f0; border-radius:14px;
      font-family:'Syne',sans-serif; font-size:15px; font-weight:700;
      color:var(--navy); cursor:pointer; transition:all 0.3s; text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-outline:hover { border-color:var(--teal); color:var(--teal); transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="confetti" id="confetti"></div>

  <div class="success-card">
    <div class="check-circle"><div class="check-icon">✓</div></div>

    <h1 class="success-title">Order Placed! 🎉</h1>
    <p class="success-sub">Your order has been confirmed and is being prepared. You'll receive your medicines shortly!</p>

    <div class="order-box" id="orderBox">
      <div class="order-row">
        <span class="order-label">Order Number</span>
        <span class="order-val" id="orderNumber">—</span>
      </div>
      <div class="order-row">
        <span class="order-label">Total Amount</span>
        <span class="order-val" id="orderTotal">—</span>
      </div>
      <div class="order-row">
        <span class="order-label">Payment</span>
        <span class="order-val">Cash on Delivery</span>
      </div>
      <div class="order-row">
        <span class="order-label">Status</span>
        <span class="status-pill">✓ Confirmed</span>
      </div>
    </div>

    <div class="items-preview" id="itemsPreview"></div>

    <div class="delivery-info">
      <div class="delivery-icon">🚚</div>
      <div class="delivery-text">
        <strong>Estimated Delivery: ~30 minutes</strong>
        <small>Our delivery partner is on the way!</small>
      </div>
    </div>

    <div class="btn-group">
      <a href="dashboard.html" class="btn-primary">📦 View My Orders</a>
      <a href="index.html" class="btn-outline">🏠 Continue Shopping</a>
    </div>
  </div>

<script>
// Load last order details
const order = JSON.parse(localStorage.getItem('pharmora_last_order') || 'null');

if (order) {
  document.getElementById('orderNumber').textContent = order.order_number || ('PH' + Date.now());
  document.getElementById('orderTotal').textContent  = '₹' + (order.total_amount || 0);

  // Items chips
  const items = order.items || [];
  if (items.length) {
    const preview = document.getElementById('itemsPreview');
    preview.innerHTML = `<h4>Items Ordered</h4>` +
      items.map(i => `<span class="item-chip">💊 ${i.name} × ${i.qty || i.quantity || 1}</span>`).join('');
  }
}

// Confetti effect
const colors = ['#14b8a6','#06b6d4','#0d9488','#22d3ee','#5eead4','#a7f3d0'];
const container = document.getElementById('confetti');
for (let i = 0; i < 50; i++) {
  const dot = document.createElement('div');
  dot.className = 'c-dot';
  const size = Math.random() * 10 + 5;
  dot.style.cssText = `
    width:${size}px; height:${size}px;
    background:${colors[Math.floor(Math.random()*colors.length)]};
    left:${Math.random()*100}%;
    top:-20px;
    animation-duration:${Math.random()*3+2}s;
    animation-delay:${Math.random()*2}s;
    opacity:${Math.random()*0.7+0.3};
  `;
  container.appendChild(dot);
}
// Stop confetti after 5 seconds
setTimeout(() => { container.innerHTML = ''; }, 5000);
</script>
</body>
</html>
